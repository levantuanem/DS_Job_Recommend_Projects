project:
  name: DS_Job_Level_Recommend
  random_state: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  raw_postings_path: data/raw/postings.csv
  processed_path: data/processed/postings_clean.csv
  companies_path: data/processed/companies_clean.csv
  salaries_path: data/processed/salaries_clean.csv
  skills_path: data/processed/job_skills_clean.csv

target:
  column: formatted_experience_level
  classes:
    - Entry level
    - Associate
    - Mid-Senior level
    - Director
    - Executive
    - Internship

features:
  text_columns:
    - title
    - description
    - skills_desc
  primary_text: description
  numerical_columns:
    - min_salary
    - med_salary
    - max_salary
    - normalized_salary
    - views
    - applies
  categorical_columns:
    - work_type
    - formatted_work_type
    - remote_allowed
    - pay_period
    - currency
    - compensation_type

model:
  name: random_forest
  n_estimators: 200
  random_state: 42
  test_size: 0.2
  cv_folds: 3
  k_fold: 3