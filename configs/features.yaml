# ============================================================
# FEATURE ENGINEERING CONFIGURATION
# Project: DS Job Recommend
# ============================================================

# ============================================================
# 1. TARGET
# ============================================================
target:
  column: formatted_experience_level

# ============================================================
# 2. NUMERICAL FEATURES
# ============================================================
numerical:
  input_columns:
    - min_salary
    - med_salary
    - max_salary
    - normalized_salary
    - views
    - applies

  engineered_columns:
    - salary_range
    - log_salary
    - application_rate
    - view_to_apply_ratio

# ============================================================
# 3. CATEGORICAL FEATURES
# ============================================================
categorical:
  columns:
    - work_type
    - formatted_work_type
    - remote_allowed
    - pay_period
    - currency
    - location
    - application_type

  encoding:
    method: one_hot
    handle_unknown: ignore

# ============================================================
# 4. TEXT FEATURES
# ============================================================
text:
  columns:
    - title
    - description
    - skills_desc

  engineered_columns:
    - combined_text
    - text_length
    - word_count
    - sentence_count
    - skill_count
    - keyword_count
    - technical_keyword_count
    - management_keyword_count
    - leadership_keyword_count

# ============================================================
# 5. SKILL EXTRACTION
# ============================================================
skills:
  programming:
    - python
    - java
    - javascript
    - typescript
    - c
    - cpp
    - csharp
    - r
    - scala
    - go

  database:
    - sql
    - mysql
    - postgresql
    - mongodb
    - oracle

  data_science:
    - pandas
    - numpy
    - scikit-learn
    - tensorflow
    - pytorch
    - machine learning
    - deep learning
    - data science

  cloud:
    - aws
    - azure
    - gcp
    - google cloud

  tools:
    - git
    - docker
    - kubernetes
    - excel

  management:
    - leadership
    - management
    - project management

# ============================================================
# 6. NLP / TF-IDF
# ============================================================
nlp:
  lowercase: true
  stop_words: english
  tfidf:
    enabled: true
    max_features: 10000
    ngram_range:
      - 1
      - 2
    min_df: 2
    max_df: 0.95
    sublinear_tf: true

# ============================================================
# 7. PREPROCESSING
# ============================================================
preprocessing:
  numerical:
    imputer:
      enabled: true
      strategy: median

    scaler:
      enabled: true
      method: standard

  categorical:
    imputer:
      enabled: true
      strategy: most_frequent

    encoder:
      enabled: true
      method: one_hot
      handle_unknown: ignore

# ============================================================
# 8. FEATURE SELECTION
# ============================================================
selection:
  enabled: true
  methods:
    variance: true
    correlation: true
    mutual_information: true
  variance_threshold: 0.0
  correlation_threshold: 0.95

# ============================================================
# 9. DATA LEAKAGE
# ============================================================
leakage:
  target_column: formatted_experience_level
  suspicious_features:
    - views
    - applies
    - application_rate
    - view_to_apply_ratio

  check_post_publication_features: true