target:
  column: formatted_experience_level

numerical:
  input_columns:
    - min_salary
    - med_salary
    - max_salary
    - normalized_salary
    - title_length
    - description_length
    - skills_length
    - description_word_count
    - skills_word_count
    - posting_year
    - posting_month
    - posting_day
    - posting_dayofweek
    - posting_quarter
    - posting_hour
    - is_weekend
    - skill_count
    - skill_indicators_from_vocabulary

categorical:
  columns:
    - location
    - pay_period
    - formatted_work_type
    - application_type
    - work_type
    - currency
    - compensation_type
  imputer:
    strategy: constant
    fill_value: unknown
  encoder:
    method: one_hot
    handle_unknown: ignore

binary:
  columns:
    - remote_allowed
    - sponsored
  imputer:
    strategy: most_frequent

text:
  source_columns:
    - title
    - description
  vectorizers:
    title:
      method: tfidf
      lowercase: true
      stop_words: english
      ngram_range: [1, 2]
      max_features: 5000
      min_df: 3
      max_df: 0.98
      dtype: float32
    description:
      method: tfidf
      lowercase: true
      stop_words: english
      ngram_range: [1, 1]
      max_features: 20000
      min_df: 10
      max_df: 0.95
      dtype: float32

preprocessing:
  numerical:
    imputer: mean
    scaler: standard

skills:
  text_source: skills_desc
  vocabulary_source: src/features/skill_extraction.py
  output: binary_feature_per_vocabulary_entry
  aggregate_feature: skill_count

selection:
  method: select_k_best_f_classif
  k: 1000
  enabled_by_default: false

leakage:
  target_column: formatted_experience_level
  grouping_column: company_id
  fallback_grouping_column: company_name
  excluded_from_model:
    - company_id
    - company_name
    - job_id
    - listed_time
    - expiry
    - closed_time